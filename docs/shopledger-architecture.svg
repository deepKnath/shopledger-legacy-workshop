<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express routers, library modules, configuration, JSON database, and order placement flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 15px Arial,sans-serif;fill:#475569}
      .section{font:700 16px Arial,sans-serif;fill:#334155;letter-spacing:1px}.box{stroke:#cbd5e1;stroke-width:2;rx:12}.label{font:600 15px Arial,sans-serif;fill:#0f172a}.small{font:400 12px Arial,sans-serif;fill:#475569}.tiny{font:400 11px Arial,sans-serif;fill:#64748b}
      .ui{fill:#dbeafe;stroke:#60a5fa}.router{fill:#ede9fe;stroke:#8b5cf6}.lib{fill:#ecfdf5;stroke:#34d399}.data{fill:#fef3c7;stroke:#f59e0b}.config{fill:#fce7f3;stroke:#ec4899}.flow{stroke:#0f766e;stroke-width:3;fill:none;marker-end:url(#flowArrow)}.dep{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}
      .step{fill:#0f766e}.steptext{font:700 12px Arial,sans-serif;fill:white;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1180"/>
  <text class="title" x="70" y="58">ShopLedger architecture</text>
  <text class="subtitle" x="70" y="86">Express POS, inventory, Khata ledger, invoices, and JSON persistence</text>

  <text class="section" x="70" y="135">BROWSER UI</text>
  <rect class="box ui" x="70" y="155" width="360" height="220"/>
  <text class="label" x="95" y="188">public/</text>
  <text class="small" x="95" y="218">index.html — POS and dashboard screens</text>
  <text class="small" x="95" y="245">js/app.js — browser API calls and rendering</text>
  <text class="small" x="95" y="272">css/style.css — application styling</text>
  <text class="tiny" x="95" y="315">New Order · Order History · Customer Khata ·</text>
  <text class="tiny" x="95" y="335">Inventory &amp; GST Audit</text>

  <text class="section" x="520" y="135">EXPRESS ROUTES</text>
  <rect class="box router" x="500" y="155" width="320" height="92"/>
  <text class="label" x="525" y="188">routes/products.js</text><text class="small" x="525" y="215">/api/products · /api/coupons</text>
  <rect class="box router" x="500" y="270" width="320" height="92"/>
  <text class="label" x="525" y="303">routes/orders.js</text><text class="small" x="525" y="330">/api/orders · cancellation</text>
  <rect class="box router" x="500" y="385" width="320" height="92"/>
  <text class="label" x="525" y="418">routes/customers.js</text><text class="small" x="525" y="445">/api/customers · settlements</text>
  <rect class="box router" x="500" y="500" width="320" height="110"/>
  <text class="label" x="525" y="533">routes/reports.js</text><text class="small" x="525" y="560">dashboard · GST reconciliation</text><text class="small" x="525" y="583">pricing preview · admin export</text>

  <text class="section" x="900" y="135">LIBRARY MODULES</text>
  <rect class="box lib" x="880" y="155" width="270" height="78"/><text class="label" x="905" y="188">lib/store.js</text><text class="small" x="905" y="211">read/write + audit log</text>
  <rect class="box lib" x="1170" y="155" width="270" height="78"/><text class="label" x="1195" y="188">lib/orders.js</text><text class="small" x="1195" y="211">create/list/cancel orders</text>
  <rect class="box lib" x="880" y="255" width="270" height="78"/><text class="label" x="905" y="288">lib/inventory.js</text><text class="small" x="905" y="311">stock checks and summaries</text>
  <rect class="box lib" x="1170" y="255" width="270" height="78"/><text class="label" x="1195" y="288">lib/pricing.js</text><text class="small" x="1195" y="311">subtotal and totals</text>
  <rect class="box lib" x="880" y="355" width="270" height="78"/><text class="label" x="905" y="388">lib/coupons.js</text><text class="small" x="905" y="411">validation and discounts</text>
  <rect class="box lib" x="1170" y="355" width="270" height="78"/><text class="label" x="1195" y="388">lib/tax.js</text><text class="small" x="1195" y="411">HSN GST and CGST/SGST</text>
  <rect class="box lib" x="880" y="455" width="270" height="78"/><text class="label" x="905" y="488">lib/ledger.js</text><text class="small" x="905" y="511">Khata and settlements</text>
  <rect class="box lib" x="1170" y="455" width="270" height="78"/><text class="label" x="1195" y="488">lib/reports.js</text><text class="small" x="1195" y="511">dashboard and reconciliation</text>
  <rect class="box lib" x="880" y="555" width="270" height="78"/><text class="label" x="905" y="588">lib/invoice.js</text><text class="small" x="905" y="611">printable HTML invoice</text>
  <rect class="box lib" x="1170" y="555" width="270" height="78"/><text class="label" x="1195" y="588">lib/dates.js</text><text class="small" x="1195" y="611">date formatting/filtering</text>

  <text class="section" x="1510" y="135">PERSISTENCE &amp; CONFIG</text>
  <rect class="box config" x="1490" y="175" width="250" height="100"/><text class="label" x="1515" y="210">config.js</text><text class="small" x="1515" y="237">port, shop identity,</text><text class="small" x="1515" y="257">tax slabs, coupons, admin key</text>
  <rect class="box data" x="1490" y="330" width="250" height="120"/><text class="label" x="1515" y="365">data/db.json</text><text class="small" x="1515" y="392">products · orders</text><text class="small" x="1515" y="412">customers · settlements</text><text class="small" x="1515" y="432">auditLog · ID counters</text>

  <path class="dep" d="M430 265 C455 265 470 205 500 205"/><path class="dep" d="M430 285 C455 285 470 320 500 320"/><path class="dep" d="M430 305 C455 305 470 435 500 435"/><path class="dep" d="M430 325 C455 325 470 555 500 555"/>
  <path class="dep" d="M820 205 L880 195"/><path class="dep" d="M820 316 L1170 195"/><path class="dep" d="M820 316 L880 295"/><path class="dep" d="M820 316 L1170 295"/><path class="dep" d="M820 316 L880 395"/><path class="dep" d="M820 316 L1170 395"/><path class="dep" d="M820 435 L880 495"/><path class="dep" d="M820 555 L1170 495"/>
  <path class="dep dash" d="M1150 195 L1490 390"/><path class="dep dash" d="M1150 295 L1490 390"/><path class="dep dash" d="M1150 495 L1490 390"/><path class="dep dash" d="M1150 595 L1490 390"/>
  <path class="dep dash" d="M1490 225 C1430 225 1400 395 1440 395"/><path class="dep dash" d="M1490 225 C1400 225 1370 590 1440 590"/>

  <text class="section" x="70" y="700">ORDER PLACEMENT FLOW</text>
  <rect class="box ui" x="70" y="735" width="250" height="90"/><circle class="step" cx="95" cy="760" r="14"/><text class="steptext" x="95" y="760">1</text><text class="label" x="120" y="765">Select cart</text><text class="small" x="95" y="795">public/js/app.js</text>
  <rect class="box router" x="365" y="735" width="250" height="90"/><circle class="step" cx="390" cy="760" r="14"/><text class="steptext" x="390" y="760">2</text><text class="label" x="415" y="765">Preview pricing</text><text class="small" x="390" y="795">POST /api/pricing/preview</text>
  <rect class="box router" x="660" y="735" width="250" height="90"/><circle class="step" cx="685" cy="760" r="14"/><text class="steptext" x="685" y="760">3</text><text class="label" x="710" y="765">Submit order</text><text class="small" x="685" y="795">POST /api/orders</text>
  <rect class="box lib" x="955" y="735" width="250" height="90"/><circle class="step" cx="980" cy="760" r="14"/><text class="steptext" x="980" y="760">4</text><text class="label" x="1005" y="765">Validate and total</text><text class="small" x="980" y="795">inventory · pricing · tax</text>
  <rect class="box lib" x="1250" y="735" width="250" height="90"/><circle class="step" cx="1275" cy="760" r="14"/><text class="steptext" x="1275" y="760">5</text><text class="label" x="1300" y="765">Commit business state</text><text class="small" x="1275" y="795">stock · Khata · order</text>
  <rect class="box data" x="1545" y="735" width="190" height="90"/><circle class="step" cx="1570" cy="760" r="14"/><text class="steptext" x="1570" y="760">6</text><text class="label" x="1595" y="765">Write JSON</text><text class="small" x="1570" y="795">data/db.json</text>
  <path class="flow" d="M320 780 L365 780"/><path class="flow" d="M615 780 L660 780"/><path class="flow" d="M910 780 L955 780"/><path class="flow" d="M1205 780 L1250 780"/><path class="flow" d="M1500 780 L1545 780"/>
  <path class="flow dash" d="M1080 825 C1080 900 780 900 780 825"/><text class="tiny" x="860" y="890">server returns created order; UI refreshes dashboard, products, orders, and customers</text>

  <rect x="70" y="955" width="1665" height="145" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text class="label" x="95" y="990">Runtime boundary</text>
  <text class="small" x="95" y="1018">server.js wires Express, body-parser, static public files, and all routers. Every request reads data/db.json; mutating requests rewrite the whole file.</text>
  <text class="small" x="95" y="1050">Invoice route: GET /orders/:id/invoice → store.read() → orders.get() → invoice.render().</text>
  <text class="small" x="95" y="1082">Configuration is loaded from config.js; PORT may be overridden by the PORT environment variable.</text>
</svg>
